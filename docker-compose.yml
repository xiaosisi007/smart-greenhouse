services:
  # MQTT Broker
  emqx:
    image: emqx/emqx:5.8
    container_name: gh-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"      # MQTT
      - "8083:8083"      # MQTT over WebSocket
      - "18083:18083"    # Dashboard (默认 admin / public)
    volumes:
      - emqx-data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 12

  # 时序数据库
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: gh-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: greenhouse
      POSTGRES_PASSWORD: greenhouse
      POSTGRES_DB: greenhouse
    ports:
      - "5432:5432"
    volumes:
      - ts-data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenhouse"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 后端 API
  api:
    build: ./backend
    container_name: gh-api
    restart: unless-stopped
    environment:
      GH_DATABASE_URL: postgresql://greenhouse:greenhouse@timescaledb:5432/greenhouse
      GH_MQTT_HOST: emqx
      GH_MQTT_PORT: "1883"
    ports:
      - "8000:8000"
    depends_on:
      emqx:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

volumes:
  emqx-data:
  ts-data:
