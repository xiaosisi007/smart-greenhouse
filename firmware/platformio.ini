; 智能大棚控制器固件 (ESP32 + SIM7600 4G)
; 烧录:  pio run -t upload    串口监视:  pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D TINY_GSM_MODEM_SIM7600
    -D TINY_GSM_RX_BUFFER=1024

lib_deps =
    vshymanskyy/TinyGSM@^0.12.0
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit SHT31 Library@^2.2.2
    claws/BH1750@^1.3.0
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
    adafruit/Adafruit ADS1X15@^2.5.0

; 4 电机配置 (MCP23017 + ADS1115 扩展):  pio run -e esp32dev-4motor
[env:esp32dev-4motor]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D MOTOR_COUNT=4

; 单电机配置 (仅 1 台卷帘):  pio run -e esp32dev-1motor
[env:esp32dev-1motor]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D MOTOR_COUNT=1
